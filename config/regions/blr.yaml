# Bengaluru in street-level detail. Built from the Geofabrik India extract, cut to this box.
id: blr
kind: city
name: Bengaluru
bbox: [77.45, 12.82, 77.80, 13.15]       # west, south, east, north
road_classes: [motorway, trunk, primary, secondary]
max_segment_km: 3
